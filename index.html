<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>UiLang v1.1 ステップ実行環境</title>
<style>
body { font-family: system-ui, sans-serif; background:#f7f7fb; padding:20px }
h1 { font-size:1.6rem }
textarea { width:100%; font-family: monospace; }
#code { height:220px; }
#input { height:80px; }
pre { background:#111; color:#0f0; padding:10px; min-height:120px; overflow-x:auto }
button { padding:10px 16px; font-size:1rem; margin-right:5px }
.section { margin-bottom:20px }
table { border-collapse: collapse; margin-top:10px; }
td, th { border:1px solid #ccc; padding:4px 8px; font-family: monospace }
td.ptr { background:#eef; }
</style>
</head>
<body>

<h1>🧠 UiLang v1.1 ステップ実行環境</h1>
<p>Brainf*ck 由来・UTF-8対応 / v1.1 命令実装 / ステップ実行対応</p>

<div class="section">
  <h2>コード</h2>
  <textarea id="code">
寝な！ 16歳だぞ ここで会ったが12352年目 ういビーム
ここで会ったが12356年目 ういビーム
ここで会ったが12363年目 ういビーム ここで会ったが12358年目 ういビーム
  </textarea>
</div>

<div class="section">
  <h2>標準入力</h2>
  <textarea id="input" placeholder="基本使いません"></textarea>
</div>

<button onclick="resetUiLang()">リセット</button>
<button onclick="stepUiLang()">1命令ステップ実行</button>
<button onclick="runUiLang()">通常実行</button>

<h2>出力</h2>
<pre id="output"></pre>

<h2>テープ状態（0～9番セル表示）</h2>
<table id="tapeTable">
<tr><th>#</th><th>値</th><th>文字</th></tr>
</table>

<script>
let tape = new Array(30000).fill(0);
let ptr = 0;
let pc = 0;
let output = '';
let instructions = []; // 命令単位の配列

function parseCode() {
  const src = document.getElementById("code").value;
  instructions = [];
  src.split(/\r?\n/).forEach(line => {
    line.trim().split(/\s+/).filter(c=>c).forEach(cmd=>{
      instructions.push(cmd);
    });
  });
}

function resetUiLang() {
  tape.fill(0);
  ptr = 0;
  pc = 0;
  output = '';
  parseCode();
  updateTapeTable();
}

function updateTapeTable() {
  const tapeTable = document.getElementById("tapeTable");
  tapeTable.innerHTML = '<tr><th>#</th><th>値</th><th>文字</th></tr>';
  for(let i=0;i<10;i++){
    const val = tape[i];
    const ch = val>0 ? String.fromCodePoint(val) : '';
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${i}</td><td>${val}</td><td>${ch}</td>`;
    if(i===ptr) tr.classList.add('ptr');
    tapeTable.appendChild(tr);
  }
  document.getElementById("output").textContent = output || '(出力なし)';
}

function executeInstruction(cmd){
  if(/^寝な！/.test(cmd)) tape[ptr]=0;
  else if(/^ここで会ったが(\d+)年目/.test(cmd)){
    const m = cmd.match(/^ここで会ったが(\d+)年目/);
    tape[ptr]=parseInt(m[1]);
  }
  else if(/^16歳だぞ/.test(cmd)) tape[ptr]=16;
  else if(/^テトリス(\d+)：(\d+)位/.test(cmd)){
    const m = cmd.match(/^テトリス(\d+)：(\d+)位/);
    tape[ptr]+=parseInt(m[1])*parseInt(m[2]);
  }
  else if(/^きゃっきゃっ/.test(cmd)) tape[ptr]++;
  else if(/^ういビーム/.test(cmd)) output+=String.fromCodePoint(tape[ptr]);
  else if(/^ういこらしょ/.test(cmd)) tape[ptr]++;
  else if(/^やんのか？/.test(cmd)) tape[ptr]=Math.max(0,tape[ptr]-1);
  else if(/^はい次〜/.test(cmd)) ptr++;
  else if(/^くぅ〜ん/.test(cmd)) ptr--;
}

function stepUiLang() {
  if(pc>=instructions.length) return;
  executeInstruction(instructions[pc]);
  pc++;
  updateTapeTable();
}

function runUiLang() {
  resetUiLang();
  while(pc<instructions.length){
    executeInstruction(instructions[pc]);
    pc++;
  }
  updateTapeTable();
}

resetUiLang();
</script>
</body>
</html>
