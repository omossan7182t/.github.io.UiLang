<h2>出力</h2>
<pre id="output"></pre>

<script>
const COMMANDS = [
  ["はい次〜", ">"],
  ["くぅ〜ん", "<"],
  ["ういこらしょ", "+"],
  ["やんのか？", "-"],
  ["ういビーム", "."],
  ["リスナー募集", ","],
  ["は?", "["],
  ["負けないが？", "]"],
];

function tokenize(code) {
  const tokens = [];
  for (let i = 0; i < code.length;) {
    let matched = false;
    for (const [word, cmd] of COMMANDS) {
      if (code.startsWith(word, i)) {
        tokens.push(cmd);
        i += word.length;
        matched = true;
        break;
      }
    }
    if (!matched) i++;
  }
  return tokens;
}

function runUiLang() {
  const src = document.getElementById("code").value;
  const inputStr = document.getElementById("input").value;

  const bf = tokenize(src);
  const tape = new Array(30000).fill(0);
  let ptr = 0;
  let pc = 0;
  let inputPtr = 0;
  let output = "";
  const stack = [];

  while (pc < bf.length) {
    switch (bf[pc]) {
      case "+":
        tape[ptr]++;
        break;
      case "-":
        tape[ptr] = Math.max(0, tape[ptr] - 1);
        break;
      case ">":
        ptr++;
        break;
      case "<":
        ptr--;
        break;
      case ".":
        output += String.fromCodePoint(tape[ptr]);
        break;
      case ",":
        if (inputPtr < inputStr.length) {
          const cp = inputStr.codePointAt(inputPtr);
          tape[ptr] = cp;
          inputPtr += cp > 0xFFFF ? 2 : 1;
        } else {
          tape[ptr] = 0;
        }
        break;
      case "[":
        if (tape[ptr] === 0) {
          let depth = 1;
          while (depth) {
            pc++;
            if (bf[pc] === "[") depth++;
            if (bf[pc] === "]") depth--;
          }
        } else {
          stack.push(pc);
        }
        break;
      case "]":
        if (tape[ptr] !== 0) {
          pc = stack[stack.length - 1];
        } else {
          stack.pop();
        }
        break;
    }
    pc++;
  }

  document.getElementById("output").textContent =
    output || "(出力なし)";
}
</script>
