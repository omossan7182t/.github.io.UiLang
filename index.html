<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>UiLang v1.1 実行環境</title>
<style>
body { font-family: system-ui, sans-serif; background:#f7f7fb; padding:20px }
h1 { font-size:1.6rem }
textarea { width:100%; font-family: monospace; }
#code { height:220px; }
#input { height:80px; }
pre { background:#111; color:#0f0; padding:10px; min-height:120px; overflow-x:auto; white-space:pre-wrap; word-break:break-word; }
button { padding:10px 16px; font-size:1rem; margin-right:4px }
.section { margin-bottom:20px }
table { border-collapse: collapse; margin-top:10px; }
td, th { border:1px solid #ccc; padding:4px 8px; font-family: monospace; text-align:center; }
</style>
</head>
<body>

<h1>UiLang v1.1 実行環境</h1>
<p>Brainf*ck 由来・UTF-8対応 / v1.1 命令実装</p>

<div class="section">
  <h2>コード</h2>
  <textarea id="code">
寝な！
16歳だぞ
ここで会ったが12375年目 ういビーム
  </textarea>
</div>

<div class="section">
  <h2>標準入力</h2>
  <textarea id="input" placeholder="基本使いません"></textarea>
</div>

<button onclick="runUiLang()">一括実行</button>
<button onclick="stepUiLang()">1ステップ実行</button>
<button onclick="resetUiLang()">リセット</button>

<h2>出力</h2>
<pre id="output"></pre>

<h2>テープ状態</h2>
<table id="tapeTable">
<tr><th>#</th><th>値</th><th>文字</th></tr>
</table>

<script>
let tape = new Array(30000).fill(0);
let ptr = 0;
let pc = 0;
let lines = [];
let output = '';

function parseLines() {
  lines = document.getElementById("code").value.split(/\r?\n/).map(l => l.trim()).filter(l => l);
}

function updateTable() {
  const tapeTable = document.getElementById("tapeTable");
  tapeTable.innerHTML = '<tr><th>#</th><th>値</th><th>文字</th></tr>';
  for (let i = 0; i < 10; i++) {
    const val = tape[i];
    const ch = val > 0 ? String.fromCodePoint(val) : '';
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${i}</td><td>${val}</td><td>${ch}</td>`;
    tapeTable.appendChild(tr);
  }
}

function executeLine(line) {
  const parts = line.split(/\s+/);
  for (const part of parts) {
    // 明示ゼロ化
    if (/^寝な！/.test(part)) tape[ptr] = 0;
    // 絶対値ロード
    else if (/^ここで会ったが(\d+)年目/.test(part)) tape[ptr] = parseInt(part.match(/^ここで会ったが(\d+)年目/)[1]);
    // 基準点
    else if (/^16歳だぞ/.test(part)) tape[ptr] = 16;
    // 乗算ループ短縮
    else if (/^テトリス(\d+)：(\d+)位/.test(part)) {
      const m = part.match(/^テトリス(\d+)：(\d+)位/);
      tape[ptr] += parseInt(m[1]) * parseInt(m[2]);
    }
    // 高頻度差分 +10
    else if (/^きゃっきゃっ/.test(part)) tape[ptr] += 10;
    // 差分加算
    else if (/^ういこらしょ/.test(part)) tape[ptr]++;
    // 差分減算
    else if (/^やんのか？/.test(part)) tape[ptr] = Math.max(0, tape[ptr]-1);
    // ポインタ移動
    else if (/^はい次〜/.test(part)) ptr++;
    else if (/^くぅ〜ん/.test(part)) ptr--;
    // 出力
    else if (/^ういビーム/.test(part)) output += String.fromCodePoint(tape[ptr]);
  }
}

function runUiLang() {
  parseLines();
  output = '';
  pc = 0;
  tape.fill(0);
  ptr = 0;

  while (pc < lines.length) {
    executeLine(lines[pc]);
    pc++;
  }
  document.getElementById("output").textContent = output || '(出力なし)';
  updateTable();
}

function stepUiLang() {
  if (!lines.length) parseLines();
  if (pc >= lines.length) return;
  executeLine(lines[pc]);
  pc++;
  document.getElementById("output").textContent = output || '(出力なし)';
  updateTable();
}

function resetUiLang() {
  tape.fill(0);
  ptr = 0;
  pc = 0;
  output = '';
  document.getElementById("output").textContent = '';
  updateTable();
}
updateTable();
</script>

</body>
</html>
