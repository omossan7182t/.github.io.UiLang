<div class="section">
  <h2>標準入力（リスナー募集）</h2>
  <textarea id="input" placeholder="※ 通常は使いません"></textarea>
</div>

<button onclick="runUiLang()">実行</button>

<h2>出力</h2>
<pre id="output"></pre>

<script>
const COMMANDS = [
  ["はい次〜", ">"],
  ["くぅ〜ん", "<"],
  ["ういこらしょ", "+"],
  ["やんのか？", "-"],
  ["ういビーム", "."],
  ["リスナー募集", ","],
  ["は?", "["],
  ["負けないが？", "]"],
];

function tokenize(code) {
  const tokens = [];
  for (let i = 0; i < code.length;) {
    let matched = false;
    for (const [word, cmd] of COMMANDS) {
      if (code.startsWith(word, i)) {
        tokens.push(cmd);
        i += word.length;
        matched = true;
        break;
      }
    }
    if (!matched) i++;
  }
  return tokens;
}

function runUiLang() {
  const src = document.getElementById("code").value;
  const inputStr = document.getElementById("input").value;
  let inputPtr = 0;

  const prog = tokenize(src);
  const tape = new Array(30000).fill(0);
  let ptr = 0;
  let pc = 0;
  const loopStack = [];
  let output = "";

  while (pc < prog.length) {
    switch (prog[pc]) {
      case "+":
        tape[ptr]++;
        break;
      case "-":
        tape[ptr] = Math.max(0, tape[ptr] - 1);
        break;
      case ">":
        ptr++;
        break;
      case "<":
        ptr = Math.max(0, ptr - 1);
        break;
      case ".":
        output += String.fromCodePoint(tape[ptr]);
        break;
      case ",":
        if (inputPtr < inputStr.length) {
          const cp = inputStr.codePointAt(inputPtr);
          tape[ptr] = cp;
          inputPtr += cp > 0xFFFF ? 2 : 1;
        } else {
          tape[ptr] = 0;
        }
        break;
      case "[":
        if (tape[ptr] === 0) {
          let depth = 1;
          while (depth > 0) {
            pc++;
            if (prog[pc] === "[") depth++;
            if (prog[pc] === "]") depth--;
          }
        } else {
          loopStack.push(pc);
        }
        break;
      case "]":
        if (tape[ptr] !== 0) {
          pc = loopStack[loopStack.length - 1];
        } else {
          loopStack.pop();
        }
        break;
    }
    pc++;
  }

  document.getElementById("output").textContent =
    output || "(出力なし)";
}
</script>
