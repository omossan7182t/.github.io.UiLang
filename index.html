<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>UiLang Playground v1.1</title>
<style>
body {
  font-family: system-ui, sans-serif;
  background: #fafafa;
  margin: 20px;
}
h1 { margin-bottom: 0.2em; }
textarea {
  width: 100%;
  height: 180px;
  font-family: monospace;
}
button {
  margin: 4px;
}
#output {
  white-space: pre-wrap;
  background: #000;
  color: #0f0;
  padding: 10px;
  min-height: 80px;
}
#memory {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  padding: 6px;
  background: #eee;
}
.cell {
  min-width: 80px;
  padding: 4px;
  border: 1px solid #999;
  background: #fff;
  text-align: center;
  font-size: 12px;
}
.cell.active {
  background: #ffd;
  border-color: #f00;
}
.cell .char {
  font-size: 18px;
}
</style>
</head>

<body>
<h1>UiLang Playground v1.1</h1>
<p>ポインタ位置・数値・Unicode文字を可視化します（v1.0互換）</p>

<h3>UiLang コード</h3>
<textarea id="code"></textarea>

<h3>標準入力（通常未使用）</h3>
<textarea id="stdin" style="height:60px;"></textarea>

<div>
  <button onclick="run(false)">▶ 実行</button>
  <button onclick="run(true)">⏭ ステップ実行</button>
  速度: <input type="range" id="speed" min="10" max="500" value="100">
</div>

<h3>出力</h3>
<div id="output"></div>

<h3>メモリ</h3>
<div id="memory"></div>

<script>
/* ========= デフォルト Hello World! ========= */
const defaultCode = `
ここで会ったが72年目 ういビーム
ここで会ったが101年目 ういビーム
ここで会ったが108年目 ういビーム
ういビーム
ここで会ったが111年目 ういビーム
ここで会ったが32年目 ういビーム
ここで会ったが87年目 ういビーム
ここで会ったが111年目 ういビーム
ここで会ったが114年目 ういビーム
ここで会ったが108年目 ういビーム
ここで会ったが100年目 ういビーム
ここで会ったが33年目 ういビーム
`.trim();

document.getElementById("code").value = defaultCode;

/* ========= 内部命令定義 ========= */
function tokenize(src) {
  const tokens = [];
  const lines = src.split(/\n/);
  for (const line of lines) {
    if (/^はい次〜/.test(line)) tokens.push(">");
    else if (/^くぅ〜ん/.test(line)) tokens.push("<");
    else if (/^ういこらしょ/.test(line)) tokens.push("+");
    else if (/^やんのか？/.test(line)) tokens.push("-");
    else if (/^ういビーム/.test(line)) tokens.push(".");
    else if (/^リスナー募集/.test(line)) tokens.push(",");
    else if (/^は\?/.test(line)) tokens.push("[");
    else if (/^負けないが？/.test(line)) tokens.push("]");
    else if (/^寝な！/.test(line)) tokens.push("ZERO");
    else {
      const m = line.match(/^ここで会ったが(\d+)年目/);
      if (m) tokens.push({type:"LOAD", value:parseInt(m[1],10)});
    }
  }
  return tokens;
}

/* ========= 実行エンジン ========= */
function run(stepMode) {
  const tokens = tokenize(document.getElementById("code").value);
  const mem = Array(16).fill(0);
  let ptr = 0, ip = 0;
  let output = "";
  const outEl = document.getElementById("output");
  outEl.textContent = "";

  function render() {
    const memEl = document.getElementById("memory");
    memEl.innerHTML = "";
    mem.forEach((v,i)=>{
      const d = document.createElement("div");
      d.className = "cell" + (i===ptr?" active":"");
      d.innerHTML = `
        <div>#${i}</div>
        <div>${v}</div>
        <div class="char">${v>0 ? String.fromCodePoint(v) : "·"}</div>
      `;
      memEl.appendChild(d);
    });
  }

  render();

  function step() {
    if (ip >= tokens.length) return;

    const t = tokens[ip];
    if (t === ">") ptr = Math.min(ptr+1, mem.length-1);
    else if (t === "<") ptr = Math.max(ptr-1, 0);
    else if (t === "+") mem[ptr]++;
    else if (t === "-") mem[ptr] = Math.max(0, mem[ptr]-1);
    else if (t === ".") {
      output += String.fromCodePoint(mem[ptr]);
      outEl.textContent = output;
    }
    else if (t === "ZERO") mem[ptr] = 0;
    else if (typeof t === "object" && t.type === "LOAD") {
      mem[ptr] = t.value;
    }

    ip++;
    render();
  }

  if (stepMode) {
    step();
  } else {
    const timer = setInterval(()=>{
      if (ip >= tokens.length) {
        clearInterval(timer);
        return;
      }
      step();
    }, document.getElementById("speed").value);
  }
}
</script>
</body>
</html>
