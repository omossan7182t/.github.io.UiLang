<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>UiLang v1.1 デバッグ版</title>
<style>
body { font-family: system-ui, sans-serif; background:#f7f7fb; padding:20px }
h1 { font-size:1.6rem }
textarea { width:100%; font-family: monospace; }
#code { height:220px; }
#input { height:80px; }
pre { background:#111; color:#0f0; padding:10px; min-height:120px; overflow-x:auto }
button { padding:10px 16px; font-size:1rem; margin-right:10px }
table { border-collapse: collapse; margin-top:10px; }
td, th { border:1px solid #ccc; padding:4px 8px; font-family: monospace }
</style>
</head>
<body>

<h1>UiLang v1.1</h1>
  本言語はBrainf*ck との互換性を持ちません。<br>
　セルの値はUnicodeコードポイントとして扱われ、日本語を含む UTF-8 文字を直接出力できます。<br>
　本プロジェクトは 非公式・非公認のファンメイド作品 であり、実在の人物・団体・公式プロジェクトとは一切関係ありません。<br>

<div class="section">
  <h2>コード</h2>
  <textarea id="code">
寝な！ 16歳だぞ
ここで会ったが12375年目 ういビーム
ここで会ったが12368年目 ういビーム
ここで会ったが12428年目 ういビーム
ここで会ったが12358年目 ういビーム
ここで会ったが12356年目 ういビーム   
  </textarea>
</div>
<button onclick="runUiLang(false)">一括実行</button>
<button onclick="runUiLang(true)">ステップ実行</button>
<button onclick="clearOutput()">クリア</button>
<div class="section">
  <h2>出力</h2>
  <pre id="output">(まだ出力なし)</pre>
</div>

<div class="section">
  <h2>テープ状態</h2>
  <table id="tapeTable">
    <tr><th>#</th><th>値</th><th>文字</th></tr>
  </table>
</div>

<script>
function clearOutput() {
  document.getElementById("output").textContent = '(まだ出力なし)';
  const table = document.getElementById("tapeTable");
  table.innerHTML = '<tr><th>#</th><th>値</th><th>文字</th></tr>';
}

function runUiLang(stepMode=false) {
  const src = document.getElementById("code").value;
  const outputEl = document.getElementById("output");
  const tapeTable = document.getElementById("tapeTable");

  let tape = new Array(30000).fill(0);
  let ptr = 0;
  let output = '';

  const lines = src.split(/\r?\n/).map(l => l.trim()).filter(l => l);

  let pc = 0;

  function processLine(line, lineNo) {
    // 行内の命令をすべて抽出
    const commands = line.match(/寝な！|16歳だぞ|テトリス\d+：\d+位|きゃっきゃっ|ういこらしょ|やんのか？|ういビーム|はい次〜|くぅ〜ん|ここで会ったが\d+年目|負けないが？/g);
    if (!commands) return;

    for (let cmd of commands) {
      if (/^寝な！/.test(cmd)) tape[ptr] = 0;
      else if (/^16歳だぞ/.test(cmd)) tape[ptr] = 12354;
      else if (/^ここで会ったが(\d+)年目/.test(cmd)) {
        const match = cmd.match(/^ここで会ったが(\d+)年目/);
        if (match) {
          // 年目をそのまま tape に代入（UTF-32コードポイントとして扱える）
          tape[ptr] = Number(match[1]);
          console.log(`セル${ptr}に${tape[ptr]}を代入`);
        }
      }
      else if (/^テトリス(\d+)：(\d+)位/.test(cmd)) {
        const m = cmd.match(/^テトリス(\d+)：(\d+)位/);
        tape[ptr] += parseInt(m[1]) * parseInt(m[2]);
      }
      else if (/^きゃっきゃっ/.test(cmd)) tape[ptr] += 10;
      else if (/^ういこらしょ/.test(cmd)) tape[ptr]++;
      else if (/^やんのか？/.test(cmd)) tape[ptr] = Math.max(0, tape[ptr]-1);
      else if (/^ういビーム/.test(cmd)) output += String.fromCodePoint(tape[ptr]);
      else if (/^はい次〜/.test(cmd)) ptr++;
      else if (/^くぅ〜ん/.test(cmd)) ptr--;
      else if (/^負けないが？/.test(cmd)) { /* ループ開始/終了用の仮 */ }

      console.log(`Line ${lineNo}, cmd: ${cmd}, ptr: ${ptr}, cell: ${tape[ptr]}, char: ${tape[ptr]>0?String.fromCodePoint(tape[ptr]):''}`);
    }
  }

  function updateTable() {
    tapeTable.innerHTML = '<tr><th>#</th><th>値</th><th>文字</th></tr>';
    for (let i=0;i<10;i++){
      const val = tape[i];
      const ch = val>0?String.fromCodePoint(val):'';
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${i}</td><td>${val}</td><td>${ch}</td>`;
      tapeTable.appendChild(tr);
    }
  }

  if (stepMode) {
    // ステップ実行
    if (pc >= lines.length) return;
    processLine(lines[pc], pc+1);
    pc++;
    outputEl.textContent = output || '(まだ出力なし)';
    updateTable();
  } else {
    // 一括実行
    for (pc=0; pc<lines.length; pc++) processLine(lines[pc], pc+1);
    outputEl.textContent = output || '(まだ出力なし)';
    updateTable();
  }
}
</script>
</body>
</html>
