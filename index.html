const COMMANDS = [
  ["はい次〜", ">"],
  ["くぅ〜ん", "<"],
  ["ういこらしょ", "+"],
  ["やんのか？", "-"],
  ["ういビーム", "."],
  ["リスナー募集", ","],
  ["は?", "["],
  ["負けないが？", "]"],
];

window.addEventListener("DOMContentLoaded", () => {
  document.getElementById("code").value = DEFAULT_CODE.trim();
  document.getElementById("input").value = "";
});

function tokenize(code) {
  const tokens = [];
  for (let i = 0; i < code.length;) {
    let matched = false;
    for (const [w, c] of COMMANDS) {
      if (code.startsWith(w, i)) {
        tokens.push(c);
        i += w.length;
        matched = true;
        break;
      }
    }
    if (!matched) i++;
  }
  return tokens;
}

function runUiLang() {
  const prog = tokenize(document.getElementById("code").value);
  const tape = new Array(30000).fill(0);
  let ptr = 0, pc = 0;
  const stack = [];
  let out = "";

  while (pc < prog.length) {
    switch (prog[pc]) {
      case "+": tape[ptr]++; break;
      case "-": tape[ptr] = Math.max(0, tape[ptr] - 1); break;
      case ">": ptr++; break;
      case "<": ptr = Math.max(0, ptr - 1); break;
      case ".": out += String.fromCodePoint(tape[ptr]); break;
      case "[":
        if (tape[ptr] === 0) {
          let d = 1;
          while (d) {
            pc++;
            if (prog[pc] === "[") d++;
            if (prog[pc] === "]") d--;
          }
        } else stack.push(pc);
        break;
      case "]":
        if (tape[ptr] !== 0) pc = stack[stack.length - 1];
        else stack.pop();
        break;
    }
    pc++;
  }

  document.getElementById("output").textContent = out || "(出力なし)";
}
