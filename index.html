<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>UiLang v1.1 実行環境</title>
<style>
  body { font-family: monospace; padding: 10px; background:#f0f0f0; }
  #code { width: 100%; height: 200px; }
  #output { width: 100%; height: 100px; background: #fff; padding:5px; border:1px solid #ccc; overflow:auto; }
  #tape { margin-top: 10px; font-size: 14px; white-space: pre; }
  button { margin: 5px; }
</style>
</head>
<body>
<h1>UiLang v1.1 実行環境</h1>
<textarea id="code">
// Hello World! v1.1 デフォルトコード
ここで会ったが72年目
ういビーム
ここで会ったが101年目
ういビーム
ここで会ったが108年目
ういビーム
ういビーム
ここで会ったが111年目
ういビーム
ここで会ったが32年目
ういビーム
ここで会ったが87年目
ういビーム
ここで会ったが111年目
ういビーム
ここで会ったが114年目
ういビーム
ここで会ったが108年目
ういビーム
ここで会ったが100年目
ういビーム
ここで会ったが33年目
ういビーム
</textarea>
<br>
<button onclick="run()">実行</button>
<button onclick="resetTape()">リセット</button>
<div id="output"></div>
<div id="tape"></div>

<script>
let tape = Array(30000).fill(0);
let ptr = 0;
let inputStr = "";
let inputPtr = 0;

function resetTape() {
  tape.fill(0);
  ptr = 0;
  inputPtr = 0;
  document.getElementById("output").textContent = "";
  updateTape();
}

function updateTape() {
  // ポインタとセル値、Unicode可視化
  const tapeDisplay = tape.slice(0, 20).map((v,i)=> {
    const char = v >=32 && v<=0x10FFFF ? String.fromCodePoint(v) : '.';
    return (i===ptr? '['+v+':'+char+']' : v+':'+char);
  }).join(' ');
  document.getElementById("tape").textContent = tapeDisplay;
}

function tokenize(code) {
  const lines = code.split('\n').map(l=>l.trim()).filter(l=>l!=='');
  const tokens = [];
  for(const line of lines){
    if(line.startsWith("ここで会ったが")) {
      const m = line.match(/ここで会ったが(\d+)年目/);
      if(m) tokens.push({type:"LOAD", value:parseInt(m[1],10)});
    } else if(line.startsWith("ういこらしょ")) {
      const count = (line.match(/ういこらしょ/g)||[]).length;
      for(let i=0;i<count;i++) tokens.push("+");
    } else if(line.startsWith("やんのか？")) {
      const count = (line.match(/やんのか？/g)||[]).length;
      for(let i=0;i<count;i++) tokens.push("-");
    } else if(line==="ういビーム") tokens.push(".");
    else if(line==="くぅ〜ん") tokens.push("<");
    else if(line==="はい次〜") tokens.push(">");
    else if(line==="寝な！") tokens.push({type:"ZERO"});
    else {
      // コメントは無視
    }
  }
  return tokens;
}

function run(){
  const code = document.getElementById("code").value;
  const tokens = tokenize(code);
  let output = "";
  let pc = 0;
  const stack = [];
  while(pc < tokens.length){
    const inst = tokens[pc];
    if(typeof inst === "string"){
      switch(inst){
        case "+": tape[ptr]++; break;
        case "-": tape[ptr] = Math.max(0, tape[ptr]-1); break;
        case ">": ptr++; break;
        case "<": ptr--; break;
        case ".": output += String.fromCodePoint(tape[ptr]); break;
        case "[": 
          if(tape[ptr]===0){
            let depth=1;
            while(depth>0){
              pc++;
              if(tokens[pc]==="[") depth++;
              if(tokens[pc]==="]") depth--;
            }
          } else stack.push(pc);
          break;
        case "]":
          if(tape[ptr]!==0) pc=stack[stack.length-1];
          else stack.pop();
          break;
      }
    } else {
      switch(inst.type){
        case "LOAD": tape[ptr] = inst.value; break;
        case "ZERO": tape[ptr] = 0; break;
      }
    }
    pc++;
    updateTape();
  }
  document.getElementById("output").textContent = output;
}
resetTape();
</script>
</body>
</html>
