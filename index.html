<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>UiLang v1.1 実行環境</title>
<style>
body {
  font-family: system-ui, sans-serif;
  background: #f6f7fb;
  padding: 20px;
}
h1 { font-size: 1.6rem; }
textarea {
  width: 100%;
  font-family: monospace;
}
#code { height: 260px; }
#input { height: 60px; }
button { padding: 6px 12px; margin-right: 6px; }
pre {
  background: #111;
  color: #0f0;
  padding: 10px;
  min-height: 100px;
}
table {
  border-collapse: collapse;
  margin-top: 10px;
}
td, th {
  border: 1px solid #aaa;
  padding: 4px 8px;
  text-align: center;
}
.current {
  background: #ffe08a;
}
small { color: #555; }
</style>
</head>

<body>
<h1>UiLang v1.1 実行環境</h1>
<p>Unicode 可視化・教育用ステップ実行対応</p>

<h2>コード</h2>
<textarea id="code"></textarea>

<h2>標準入力（通常は未使用）</h2>
<textarea id="input"></textarea>

<div>
<button onclick="run()">▶ 実行</button>
<button onclick="step()">⏭ ステップ</button>
<button onclick="stop()">⏸ 停止</button>
速度 <input type="range" min="10" max="500" value="100" id="speed">
</div>

<h2>出力</h2>
<pre id="output"></pre>

<h2>現在セルの状態</h2>
<div id="cellinfo"></div>

<h2>メモリ（先頭16セル）</h2>
<div id="memory"></div>

<script>
/* ===== UiLang v1.1 命令定義 ===== */
const COMMANDS = [
  ["はい次〜", "PTR_INC"],
  ["くぅ〜ん", "PTR_DEC"],
  ["ういこらしょ", "INC"],
  ["やんのか？", "DEC"],
  ["ういビーム", "OUT"],
  ["リスナー募集", "IN"],
  ["は?", "LOOP_START"],
  ["負けないが？", "LOOP_END"],
  ["寝な！", "ZERO"],
  ["16歳だぞ", "BASE16"],
  ["きゃっきゃっ", "INC5"],
];

/* 即値ロード */
const LOAD_RE = /ここで会ったが(\d+)年目/;
/* 乗算短縮 */
const TETRIS_RE = /テトリス(\d+)：(\d+)位/;

/* ===== 初期 Hello World! ===== */
document.getElementById("code").value = `
寝な！
ここで会ったが72年目
ういビーム
ういこらしょ×29
ういビーム
ういこらしょ×7
ういビーム
ういビーム
ういこらしょ×3
ういビーム
やんのか？×79
ういビーム
ういこらしょ×55
ういビーム
`.trim();

/* ===== 実行エンジン ===== */
let tape, ptr, pc, tokens, output, timer;

function tokenize(src) {
  const result = [];
  const lines = src.split("\n");

  for (const line of lines) {
    const parts = line.trim().split(/\s+/);
    for (const part of parts) {
      if (!part) continue;

      if (LOAD_RE.test(part)) {
        result.push({
          type: "LOAD",
          value: +part.match(LOAD_RE)[1]
        });
        continue;
      }

      if (TETRIS_RE.test(part)) {
        const [, a, b] = part.match(TETRIS_RE);
        result.push({ type: "MUL", a: +a, b: +b });
        continue;
      }

      const repeat = part.match(/(.+)×(\d+)/);
      if (repeat) {
        const cmd = repeat[1];
        const n = +repeat[2];
        for (let i = 0; i < n; i++) {
          for (const [k, v] of COMMANDS) {
            if (cmd === k) result.push({ type: v });
          }
        }
        continue;
      }

      for (const [k, v] of COMMANDS) {
        if (part === k) {
          result.push({ type: v });
          break;
        }
      }
    }
  }
  return result;
}

function reset() {
  tape = new Array(30000).fill(0);
  ptr = 0;
  pc = 0;
  output = "";
  tokens = tokenize(document.getElementById("code").value);
  updateUI();
}

function executeStep() {
  if (pc >= tokens.length) return stop();

  const t = tokens[pc];
  switch (t.type) {
    case "INC": tape[ptr]++; break;
    case "INC5": tape[ptr] += 5; break;
    case "DEC": tape[ptr] = Math.max(0, tape[ptr] - 1); break;
    case "PTR_INC": ptr++; break;
    case "PTR_DEC": ptr--; break;
    case "ZERO": tape[ptr] = 0; break;
    case "BASE16": tape[ptr] = 16; break;
    case "LOAD": tape[ptr] = t.value; break;
    case "MUL": tape[ptr] += t.a * t.b; break;
    case "OUT":
      output += String.fromCodePoint(tape[ptr]);
      document.getElementById("output").textContent = output;
      break;
  }
  pc++;
  updateUI();
}

function updateUI() {
  const cp = tape[ptr];
  const char = cp < 32 ? "␀" : String.fromCodePoint(cp);
  document.getElementById("cellinfo").innerHTML =
    `値: ${cp} / 0x${cp.toString(16)} / 文字: ${char}`;

  let html = "<table><tr>";
  for (let i = 0; i < 16; i++) {
    html += `<th class="${i===ptr?"current":""}">${i}</th>`;
  }
  html += "</tr><tr>";
  for (let i = 0; i < 16; i++) {
    html += `<td class="${i===ptr?"current":""}">${tape[i]}</td>`;
  }
  html += "</tr></table>";
  document.getElementById("memory").innerHTML = html;
}

function run() {
  reset();
  timer = setInterval(executeStep, document.getElementById("speed").value);
}

function step() {
  if (!tokens) reset();
  executeStep();
}

function stop() {
  clearInterval(timer);
}
</script>
</body>
</html>
