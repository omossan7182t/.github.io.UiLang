<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>UiLang v1.1 ステップ実行環境</title>
<style>
body { font-family: system-ui, sans-serif; background:#f7f7fb; padding:20px }
h1 { font-size:1.6rem }
textarea { width:100%; font-family: monospace; }
#code { height:220px; }
#input { height:80px; }
pre { background:#111; color:#0f0; padding:10px; min-height:120px; overflow-x:auto }
button { padding:8px 12px; font-size:1rem; margin-right:5px }
.section { margin-bottom:20px }
table { border-collapse: collapse; margin-top:10px; }
td, th { border:1px solid #ccc; padding:4px 8px; font-family: monospace; text-align:center }
</style>
</head>
<body>

<h1>🧠 UiLang v1.1 ステップ実行環境</h1>
<p>Brainf*ck 由来・UTF-8対応 / v1.1 命令実装</p>

<div class="section">
  <h2>コード</h2>
  <textarea id="code">
寝な！
16歳だぞ
ここで会ったが12375年目 ういビーム
ここで会ったが12368年目 ういビーム
ここで会ったが12428年目 ういビーム
ここで会ったが12358年目 ういビーム
ここで会ったが12356年目 ういビーム
  </textarea>
</div>

<div class="section">
  <h2>標準入力</h2>
  <textarea id="input" placeholder="基本使いません"></textarea>
</div>

<div class="section">
  <button onclick="stepExecute()">ステップ実行</button>
  <button onclick="runAll()">一括実行</button>
  <button onclick="resetMachine()">クリア</button>
</div>

<h2>出力</h2>
<pre id="output">(まだ出力なし)</pre>

<h2>テープ状態</h2>
<table id="tapeTable">
<tr><th>#</th><th>値</th><th>文字</th></tr>
</table>

<script>
let tape = new Array(30000).fill(0);
let ptr = 0;
let pc = 0;
let commands = [];
let output = '';

function parseCommands() {
  const src = document.getElementById("code").value;
  const commandRegex = /(寝な！|16歳だぞ|ここで会ったが\d+年目|テトリス\d+：\d+位|きゃっきゃっ|ういこらしょ|やんのか？|はい次〜|くぅ〜ん|ういビーム)/g;
  commands = [];
  let match;
  while ((match = commandRegex.exec(src)) !== null) {
    commands.push(match[0]);
  }
}

function updateTapeTable() {
  const tapeTable = document.getElementById("tapeTable");
  tapeTable.innerHTML = '<tr><th>#</th><th>値</th><th>文字</th></tr>';
  for (let i = 0; i < 10; i++) {
    const val = tape[i];
    const ch = val > 0 ? String.fromCodePoint(val) : '';
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${i}</td><td>${val}</td><td>${ch}</td>`;
    tapeTable.appendChild(tr);
  }
}

function stepExecute() {
  if (commands.length === 0) parseCommands();
  if (pc >= commands.length) return alert('実行終了');

  const cmd = commands[pc];

  if (/^寝な！/.test(cmd)) tape[ptr] = 0;
  else if (/^16歳だぞ/.test(cmd)) tape[ptr] = 12354;
  else if (/^ここで会ったが(\d+)年目/.test(cmd)) {
    tape[ptr] = parseInt(cmd.match(/^ここで会ったが(\d+)年目/)[1]);
  }
  else if (/^テトリス(\d+)：(\d+)位/.test(cmd)) {
    const m = cmd.match(/^テトリス(\d+)：(\d+)位/);
    tape[ptr] += parseInt(m[1]) * parseInt(m[2]);
  }
  else if (/^きゃっきゃっ/.test(cmd)) tape[ptr] += 10;
  else if (/^ういこらしょ/.test(cmd)) tape[ptr]++;
  else if (/^やんのか？/.test(cmd)) tape[ptr] = Math.max(0, tape[ptr]-1);
  else if (/^はい次〜/.test(cmd)) ptr++;
  else if (/^くぅ〜ん/.test(cmd)) ptr--;
  else if (/^ういビーム/.test(cmd)) output += String.fromCodePoint(tape[ptr]);

  document.getElementById("output").textContent = output || '(まだ出力なし)';
  updateTapeTable();
  pc++;
}

function runAll() {
  parseCommands();
  while (pc < commands.length) stepExecute();
}

function resetMachine() {
  tape.fill(0);
  ptr = 0;
  pc = 0;
  output = '';
  commands = [];
  document.getElementById("output").textContent = '(まだ出力なし)';
  updateTapeTable();
}
updateTapeTable();
</script>

</body>
</html>
