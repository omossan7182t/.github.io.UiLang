<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>UiLang 実行環境</title>
<style>
  body { font-family: monospace; background:#f0f0f0; padding:10px; }
  textarea { width:100%; height:200px; font-family: monospace; font-size:16px; }
  #output { background:#fff; padding:10px; min-height:50px; white-space: pre-wrap; border:1px solid #ccc; margin-top:10px; }
  #tape { margin-top:10px; white-space: pre; background:#fff; padding:10px; border:1px solid #ccc; }
  .ptr { color:red; font-weight:bold; }
</style>
</head>
<body>
<h1>UiLang 実行環境 (v1.1)</h1>
<textarea id="code">
// デフォルト: Hello World! (v1.1)
ここで会ったが72年目 ういビーム
ここで会ったが101年目 ういビーム
ここで会ったが108年目 ういビーム
ういビーム
ここで会ったが111年目 ういビーム
ここで会ったが32年目 ういビーム
ここで会ったが87年目 ういビーム
ここで会ったが111年目 ういビーム
ここで会ったが114年目 ういビーム
ここで会ったが108年目 ういビーム
ここで会ったが100年目 ういビーム
ここで会ったが33年目 ういビーム
</textarea>
<button onclick="run()">実行</button>
<div id="output"></div>
<div id="tape"></div>

<script>
const TAPE_SIZE = 30000;
let tape = Array(TAPE_SIZE).fill(0);
let ptr = 0;

function tokenize(code){
    const lines = code.split('\n').map(l=>l.trim()).filter(l=>l!=='');
    const tokens = [];
    for(const line of lines){
        // LOAD命令
        const loadMatch = line.match(/ここで会ったが(\d+)年目/);
        if(loadMatch){
            tokens.push({type:"LOAD", value:parseInt(loadMatch[1],10)});
            const rest = line.replace(loadMatch[0],'').trim();
            if(rest){
                const subTokens = tokenize(rest);
                tokens.push(...subTokens);
            }
            continue;
        }
        // "+" 命令
        const plusCount = (line.match(/ういこらしょ/g)||[]).length;
        for(let i=0;i<plusCount;i++) tokens.push("+");
        // "-" 命令
        const minusCount = (line.match(/やんのか？/g)||[]).length;
        for(let i=0;i<minusCount;i++) tokens.push("-");
        // 出力
        if(line.includes("ういビーム")) tokens.push(".");
        // ポインタ移動
        if(line.includes("くぅ〜ん")) tokens.push("<");
        if(line.includes("はい次〜")) tokens.push(">");
        // ゼロ化
        if(line.includes("寝な！")) tokens.push({type:"ZERO"});
    }
    return tokens;
}

function run(){
    tape.fill(0);
    ptr = 0;
    const code = document.getElementById("code").value;
    const tokens = tokenize(code);
    let output = "";
    for(const tok of tokens){
        if(tok==="+" ) tape[ptr]++;
        else if(tok==="-") tape[ptr] = Math.max(0, tape[ptr]-1);
        else if(tok===".") output += String.fromCodePoint(tape[ptr]);
        else if(tok==="<") ptr = Math.max(0, ptr-1);
        else if(tok===">") ptr = Math.min(TAPE_SIZE-1, ptr+1);
        else if(tok.type==="ZERO") tape[ptr]=0;
        else if(tok.type==="LOAD") tape[ptr] = tok.value;
    }
    document.getElementById("output").textContent = output;
    renderTape();
}

function renderTape(){
    const view = tape.slice(0,50).map((v,i)=> i===ptr ? `[${v}]` : v).join(" ");
    document.getElementById("tape").textContent = view;
}
</script>
</body>
</html>
